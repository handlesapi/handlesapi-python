[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "handlesapi"
version = "0.1.0"
description = "Typed Python client for the Handles API: public social media data for X, Instagram, TikTok, YouTube, Telegram, Bluesky, Twitch, Kick and LinkedIn."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Handles API", email = "support@handlesapi.com" }]
keywords = ["social-media-api", "twitter-api", "instagram-api", "tiktok-api", "youtube-api", "openapi", "mcp"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.25,<1"]

[project.optional-dependencies]
dev = ["pytest>=7", "mypy>=1.8"]

[project.urls]
Homepage = "https://handlesapi.com"
Documentation = "https://handlesapi.com/docs"
Source = "https://github.com/handlesapi/handlesapi-python"
Issues = "https://github.com/handlesapi/handlesapi-python/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
handlesapi = ["py.typed"]

[tool.mypy]
strict = true
files = ["src"]
warn_unused_ignores = false

[tool.pytest.ini_options]
testpaths = ["tests"]
