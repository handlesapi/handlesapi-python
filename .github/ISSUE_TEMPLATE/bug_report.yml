name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Never paste your API key. Quote the `request_id` from the error response if you have one, it lets us find the call.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you got.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: The smallest code or curl command that shows it.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: "0.1.0 or a commit hash"
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Python and httpx versions
      placeholder: "Python 3.12, httpx 0.28"
